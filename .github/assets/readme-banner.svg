<svg width="1400" height="520" viewBox="0 0 1400 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Nirmal Kharal portfolio</title>
  <desc id="description">A black editorial banner with purple grid lines, an abstract NK monogram, and the words full-stack developer and creative engineer.</desc>
  <defs>
    <linearGradient id="background" x1="90" y1="0" x2="1320" y2="520" gradientUnits="userSpaceOnUse">
